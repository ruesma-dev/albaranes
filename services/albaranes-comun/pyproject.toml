# pyproject.toml
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruesma-albaranes-comun"
version = "0.6.0"
description = "Infraestructura y contratos compartidos del sistema de albaranes de Construcciones Ruesma"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "sqlalchemy>=2.0.30",
    "azure-storage-queue>=12.9",
    "azure-storage-blob>=12.20",
]

[project.optional-dependencies]
# Managed identity: solo necesario en la nube (en local se usa la
# cadena de conexión de Azurite y este extra no hace falta).
azure = ["azure-identity>=1.16"]
# SDKs de IA: solo los necesitan sv2 y sv5 (que ya los traen en su
# requirements.txt); el resto de servicios instala el paquete sin esto.
llm = ["anthropic>=0.40", "openai>=1.50", "google-genai>=1.0"]
# Conversión de contratos a Markdown (solo sv3 lo necesita en producción):
markdown = ["markitdown[pdf,docx]>=0.1"]
# Conversión de contratos Word/PDF con estructura (LibreOffice es dependencia
# del SISTEMA, no pip: apt-get install libreoffice-writer en la imagen de sv3):
office = ["markitdown[pdf,docx]>=0.1", "pypdf>=4.2"]
dev = ["pytest>=8.0", "anthropic>=0.40", "openai>=1.50", "google-genai>=1.0", "markitdown[pdf,docx]>=0.1", "python-docx>=1.1", "pypdf>=4.2"]

[tool.setuptools.packages.find]
include = ["ruesma_comun*"]
